트렌드를 탐색하고 실험합니다.\u003c/p\u003e\u003cp\u003e• 다양한 AI 도구를 활용한 경험, 콘텐츠, 서비스 아이디어를 발굴합니다.\u003c/p\u003e\u003cp\u003e• AI 기술을 리테일, 공간, 콘텐츠 등 브랜드 경험에 연결합니다.\u003c/p\u003e\u003cp\u003e• 내부 팀과 협업하여 실험을 실제 프로젝트로 확장합니다.\u003c/p\u003e\u003cp\u003e• AI 관련 인사이트를 아카이빙하고 공유합니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong class=\"gt-strong\"\u003e자격요건\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e• 새로운 AI 기술을 단순히 사용하는 것을 넘어, 그 활용 가능성을 스스로 탐색해본 분\u003c/p\u003e\u003cp\u003e• 기술 자체보다, 그것이 만들어낼 수 있는 경험과 가능성에 관심이 있는 분\u003c/p\u003e\u003cp\u003e• 완성된 결과보다 실험과 시도를 반복하는 과정에 익숙한 분\u003c/p\u003e\u003cp\u003e• 빠르게 변화하는 AI 흐름 속에서 그 변화를 자신의 관점으로 해석해본 분\u003c/p\u003e\u003cp\u003e• 팀워크를 중요시하고 커뮤니케이션 역량이 뛰어난 분\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong class=\"gt-strong\"\u003e우대사항\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e• 생성형 AI, LLM, 이미지/영상 생성 등 다양한 AI 도구를 직접 활용해본 경험 또는 결과물이 있는 분\u003c/p\u003e\u003cp\u003e• 개인 프로젝트, 실험, 프로토타입 등을 통해 스스로 기획하고 만들어본 경험이 있는 분\u003c/p\u003e\u003cp\u003e• 기술 및 AI 트렌드를 지속적으로 탐색하고, 이를 자신의 관점으로 정리하거나 기록해본 경험이 있는 분\u003c/p\u003e\u003cp\u003e• 기술을 활용해 새로운 콘텐츠 또는 서비스를 실제로 구현해본 경험이 있는 분\u003c/p\u003e\u003cp\u003e• 글로벌 AI 서비스 및 트렌드를 직접 탐색하고 활용해본 경험(영문 자료 포함)이 있는 분\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong class=\"gt-strong\"\u003e제출서류\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e• 입사지원서(필수), 자기소개서(필수), 경력기술서(선택)\u003c/p\u003e\u003cp\u003e• 포트폴리오(필수)\u003c/p\u003e\u003cp\u003e   ※ 포트폴리오는 단순 AI 생성 이미지 결과물이 아닌, AI를 다양한 방식으로 탐구하고 확장한 과정이 드러나야 합니다.\u003c/p\u003e\u003cp\u003e   ※ 다음과 같은 내용 중 하나 이상이 포함되어야 합니다.\u003c/p\u003e\u003cp\u003e      • 서로 다른 유형의 AI 도구를 활용한 실험 (생성, 자동화, 인터랙션 등)\u003c/p\u003e\u003cp\u003e      • 하나의 기술을 다양한 방식으로 적용해본 탐구 과정\u003c/p\u003e\u003cp\u003e      • AI를 활용해 새로운 경험, 서비스, 콘텐츠로 확장해본 시도\u003c/p\u003e\u003cp\u003e      • 다양한 AI 도구를 비교하고 실제 활용 가능성을 실험한 기록\u003c/p\u003e\u003cp\u003e   ※ 완성도보다 시도, 탐구 과정, 사고 방식을 중요하게 봅니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong class=\"gt-strong\"\u003e전형절차\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e• 접수기간: 상시지원\u003c/p\u003e\u003cp\u003e• 전형절차: 서류전형 - 1차 면접(인성검사 포함) - 2차 면접(사전과제 포함)\u003c/p\u003e\u003cp\u003e                   - 시용계약직(3개월 이내/평가 후 본채용) - 최종합격\u003c/p\u003e\u003cp\u003e※ 전형절차는 포지션에 따라 과제 제출, PT 발표 등이 추가될 수 있습니다.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong class=\"gt-strong\"\u003e근무조건\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e• 근무형태: 정규직 (3개월 이내 시용계약직/평가 후 본채용)\u003c/p\u003e\u003cp\u003e• 근무일시: 주5일 (월~금요일) / 09:00 ~18:00(정규직 전환 후 선택적 근로시간제로 변경됩니다)\u003c/p\u003e\u003cp\u003e• 근무지: 서울특별시 성동구 뚝섬로 433 (성수동2가, 아이아이컴바인드)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong class=\"gt-strong\"\u003e기타사항\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e• 보훈대상자, 장애인은 관련 법에 따라 우대합니다.\u003c/p\u003e\u003cp\u003e• 입사지원 서류, 기재사항에 허위사실이 발견될 경우 채용확정 이후라도 채용이 취소될 수 있습니다.\u003c/p\u003e\u003cp\u003e• 본 채용은 수시 진행되며, 전형 일정 및 채용 인원에 따라 사전 고지 없이 조기 마감될 수 있습니다.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"24:[\"$\",\"div\",null,{\"className\":\"xqcrz7y x1yvabsj x38p4s0 x78zum5 xdt5ytf x2lah0s xop7a5d x1n3te05 xmw6hcl xwblzbf x7wzq59 x18omhc x1w1tb2m x1kwjyt x16grhtn x7c4f9i xhtitgo\",\"children\":[[\"$\",\"$L38\",null,{}],[\"$\",\"div\",null,{\"className\":\"x15eojk3 xkzp1qh x178xt8z x78zum5 xdt5ytf x1rlowdq xir9ss6 xuqh1pq\",\"children\":[[\"$\",\"div\",null,{\"className\":\"x78zum5 xdt5ytf x1njl5t7 xir9ss6 xhbbwew x26ncwf xh35k3f\",\"children\":[[\"$\",\"$L39\",null,{\"applicationForm\":{\"id\":32088,\"guideLine\":null,\"useGuideLine\":false,\"latestSnapshotKey\":\"cd5d6791-33bf-4129-8f80-779d6a168dd1\",\"categories\" ame\":\"주식회사 아이아이컴바인드\",\"imageUrl\":\"https://profiles.greetinghr.com/group/76533fb1-714e-4156-9a3c-27159703e01c\"},\"terms\":{\"personalRequiredTerm\":{\"id\":18436,\"isRequired\":true,\"locales\":{\"ko\":{\"title\":\"개인정보 필수항목 수집 및 이용 동의\",\"content\":\"$3a\"},\"en\":{\"title\":\"개인정보 필수항목 수집 및 이용 동의\",\"content\":\"$3b\"}}},\"personalOptionalTerm\":{\"id\":18437,\"isRequired\":false,\"locales\":{\"ko\":{\"title\":\"개인정보 선택항목 수집 및 이용 동의\",\"content\":\"$3c\"},\"en\":{\"title\":\"개인정보 선택항목 수집 및 이용 동의\",\"content\":\"$3d\"}}},\"sensitiveTerm\":{\"id\":3,\"isRequired\":true,\"locales\":{\"ko\":{\"title\":\"민감정보 수집 및 이용 동의\",\"content\":\"\u003carticle\u003e\\n\u003cp style=\\\"line-height: 1.75em\\\"\u003e\\n회사는 채용 절차 진행을 위하여 귀하의 민감 정보를 처리(수집, 이용)하기 위해서는 「개인정보보호법」 제23조 및 장애인고용촉진 및 직업재활법에 의하여 별도 동의가 필요합니다.\\n\u003c/p\u003e\u003cbr/\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em\\\"\u003e\\n1. 수집하는 민감정보 항목\\n\u003c/p\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em; font-weight: bold\\\"\u003e•\\n [필수항목]\\n\u003c/p\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em; font-weight: bold\\\"\u003e\\n장애사항,보훈여부\\n\u003c/p\u003e\u003cbr\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em\\\"\u003e\\n2. 민감정보처리의 목적\u003c/p\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em\\\"\u003e\\n채용 적합성 판단 및 서류심사/면접 등의 근거 자료, 인재 DB 활용 등\u003c/p\u003e\u003cbr\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em\\\"\u003e\\n3. 보유기간\\n\u003c/p\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em; font-weight: bold\\\"\u003e\\n접수 지원 후 3년간, 단 정보주체의 삭제 요청이 있는 경우 지체없이 파기\u003c/p\u003e\u003cbr\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em\\\"\u003e\\n※ 회사는 본인이 작성/제출한 정보에 한하여 정보를 수집합니다. 채용서비스의 특성상 민감한 정보 등이 수집될 수 있으니 작성/제출에 유의하여 주시기 바랍니다.\\n\u003c/p\u003e\u003cbr\u003e\\n\\n\u003cp style=\\\"line-height: 1.75em\\\"\u003e\\n※ 귀하는 개인 정보 수집•이용에 대한 동의를 거부할 권리가 있습니다. 그러나 동의를 거부할 경우 원활한 기업 측으로의 지원자 정보 전달을 진행할 수 없어 본건 서비스에 제한을 받을 수 있습니다.\\n\u003c/p\u003e\"},\"en\":{\"title\":\"Agreement of Collecting and Using Sensitive Information\",\"content\":\"$3e\"}}},\"thirdPartyTerm\":{\"id\":802,\"isRequired\":false,\"locales\":{\"ko\":{\"title\":\"개인정보 제3자 이용제공 동의\",\"content\":\"\u003cdiv\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e1. 제공받는 자 : \u003cstrong\u003e주식회사 두들린\u003c/strong\u003e\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e\u003cbr\u003e\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e2. 개인정보 항목 : 성명, 전화번호, 이메일 주소, 이력서 등 채용에 필요한 개인식별이 있는 정보\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e\u003cbr\u003e\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e3. 제공 목적 : \u003cstrong\u003e채용플랫폼 '오퍼센트'를 통한 채용 관련 정보 및 혜택 제공\u003c/strong\u003e\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e\u003cbr\u003e\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e4. 보유기간 : \u003cstrong\u003e접수 지원 후 3년, 단 정보주체의 삭제 요청이 있는 경우 지체없이 파기\u003c/strong\u003e\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e\u003cbr\u003e\u003c/p\u003e\\n  \u003cp style=\\\"line-height: 1.75em;\\\"\u003e※ 귀하는 개인 정보 수집ㆍ이용에 대한 동의를 거부할 권리가 있으며, 동의하지 않아도 서비스 이용이 가능합니다. 다만, 동의하지 않을 경우 채용 관련 혜택에 대한 서비스가 제한됩니다.\u003c/p\u003e\\n\u003c/div\u003e\"},\"en\":{\"title\":\"Consent to Third Party Provision and Use of Personal Information\",\"content\":\"$3f\"}}},\"customTerms\":[]},\"openingsInfo\":{\"openingId\":211450,\"status\":\"OPEN\",\"title\":\"[GENTLE MONSTER] AI Research \u0026 Exploration 담당자\",\"detail\":\"$40\",\"openDate\":\"2026-04-10T07:58:19Z\",\"dueDate\":null,\"deadlineDDay\":null,\"commonResumeApplicantOption\":false,\"commonResumeQuestionnaireOption\":false,\"deploy\":false,\"workspaceDivision\":{\"id\":267,\"division\":\"GENTLE MONSTER\"},\"useApplicationForm\":true,\"applyConfigSnapshotKey\":\"6a4ddee468b6ad5521518154\"},\"openingSettingInfo\":{\"requireAuthentication\":true,\"canEditSubmittedApplication\":false,\"submittedApplicationEditDueDate\":null},\"additionalApplicantIn
