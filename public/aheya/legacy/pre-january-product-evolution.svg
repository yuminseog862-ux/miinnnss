<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Pre-January product evolution from Raven to AHEYA">
  <rect width="1600" height="900" fill="#10231d"/>
  <circle cx="1380" cy="150" r="230" fill="#d8aa55" opacity="0.18"/>
  <circle cx="220" cy="780" r="260" fill="#e8dbc0" opacity="0.12"/>
  <text x="90" y="112" font-family="Georgia, serif" font-size="48" fill="#fff7e6" font-weight="700">Product Evolution Evidence</text>
  <text x="92" y="154" font-family="Arial, sans-serif" font-size="23" fill="#d7cab4">Use this to show planning-to-narrowing, not performance.</text>
  <line x1="170" y1="420" x2="1430" y2="420" stroke="#f1d18a" stroke-width="6" stroke-linecap="round"/>
  <g>
    <circle cx="250" cy="420" r="30" fill="#f1d18a"/>
    <rect x="110" y="240" width="280" height="132" rx="24" fill="#fff7e6"/>
    <text x="138" y="286" font-family="Georgia, serif" font-size="30" fill="#10231d" font-weight="700">2025 Apr-Jul</text>
    <text x="138" y="326" font-family="Arial, sans-serif" font-size="21" fill="#10231d">Raven flow/spec/BP</text>
    <text x="138" y="354" font-family="Arial, sans-serif" font-size="19" fill="#5b5f53">Funding, quest, helper, reward</text>
  </g>
  <g>
    <circle cx="610" cy="420" r="30" fill="#f1d18a"/>
    <rect x="470" y="480" width="300" height="142" rx="24" fill="#f0dfbd"/>
    <text x="500" y="528" font-family="Georgia, serif" font-size="30" fill="#10231d" font-weight="700">2025 Aug-Nov</text>
    <text x="500" y="568" font-family="Arial, sans-serif" font-size="21" fill="#10231d">Market + KPI templates</text>
    <text x="500" y="596" font-family="Arial, sans-serif" font-size="19" fill="#5b5f53">Segment model and tracking schema</text>
  </g>
  <g>
    <circle cx="960" cy="420" r="30" fill="#f1d18a"/>
    <rect x="820" y="240" width="310" height="148" rx="24" fill="#d8aa55"/>
    <text x="850" y="288" font-family="Georgia, serif" font-size="30" fill="#10231d" font-weight="700">2026 Jan</text>
    <text x="850" y="328" font-family="Arial, sans-serif" font-size="21" fill="#10231d">AHEYA product pivot</text>
    <text x="850" y="356" font-family="Arial, sans-serif" font-size="19" fill="#10231d">Support + feedback + proof rail</text>
  </g>
  <g>
    <circle cx="1310" cy="420" r="30" fill="#f1d18a"/>
    <rect x="1170" y="480" width="310" height="142" rx="24" fill="#fff7e6"/>
    <text x="1200" y="528" font-family="Georgia, serif" font-size="30" fill="#10231d" font-weight="700">2026 Feb-Apr</text>
    <text x="1200" y="568" font-family="Arial, sans-serif" font-size="21" fill="#10231d">X / GTM language</text>
    <text x="1200" y="596" font-family="Arial, sans-serif" font-size="19" fill="#5b5f53">First support, first feedback, proof</text>
  </g>
  <rect x="110" y="690" width="1370" height="110" rx="28" fill="#fff7e6" opacity="0.96"/>
  <text x="152" y="735" font-family="Georgia, serif" font-size="30" fill="#10231d" font-weight="700">Portfolio transition</text>
  <text x="152" y="776" font-family="Arial, sans-serif" font-size="24" fill="#10231d">A broad Raven reward/funding/quest plan was narrowed into AHEYA's first-signal rail.</text>
</svg>
