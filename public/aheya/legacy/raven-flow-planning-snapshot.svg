<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Raven flow planning snapshot">
  <rect width="1600" height="900" fill="#f8f3e8"/>
  <text x="90" y="110" font-family="Georgia, serif" font-size="46" fill="#17231f" font-weight="700">Raven Planning Snapshot</text>
  <text x="92" y="152" font-family="Arial, sans-serif" font-size="23" fill="#5b675f">Multi-role product flow drafted before the January AHEYA pivot</text>
  <rect x="88" y="202" width="1424" height="260" rx="30" fill="#fffaf0" stroke="#d3c1a1" stroke-width="2"/>
  <text x="126" y="252" font-family="Georgia, serif" font-size="30" fill="#17231f" font-weight="700">Funder / User Flow</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#17231f">
    <rect x="126" y="295" width="150" height="54" rx="18" fill="#ecd7a8"/>
    <text x="153" y="329">Homepage</text>
    <path d="M276 322 L336 322" stroke="#17231f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="336" y="295" width="150" height="54" rx="18" fill="#ecd7a8"/>
    <text x="381" y="329">Login</text>
    <path d="M486 322 L546 322" stroke="#17231f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="546" y="295" width="170" height="54" rx="18" fill="#ecd7a8"/>
    <text x="583" y="329">Wallet / KYC</text>
    <path d="M716 322 L776 322" stroke="#17231f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="776" y="295" width="160" height="54" rx="18" fill="#ecd7a8"/>
    <text x="820" y="329">Explore</text>
    <path d="M936 322 L996 322" stroke="#17231f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="996" y="295" width="190" height="54" rx="18" fill="#ecd7a8"/>
    <text x="1027" y="329">Funding / Quest</text>
    <path d="M1186 322 L1246 322" stroke="#17231f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1246" y="295" width="190" height="54" rx="18" fill="#ecd7a8"/>
    <text x="1284" y="329">Proof / Reward</text>
  </g>
  <rect x="88" y="518" width="1424" height="260" rx="30" fill="#17231f"/>
  <text x="126" y="568" font-family="Georgia, serif" font-size="30" fill="#fff7e6" font-weight="700">Creator Flow</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#17231f">
    <rect x="126" y="612" width="170" height="54" rx="18" fill="#fff7e6"/>
    <text x="168" y="646">Creator login</text>
    <path d="M296 639 L356 639" stroke="#fff7e6" stroke-width="3" marker-end="url(#arrowLight)"/>
    <rect x="356" y="612" width="190" height="54" rx="18" fill="#fff7e6"/>
    <text x="385" y="646">Register project</text>
    <path d="M546 639 L606 639" stroke="#fff7e6" stroke-width="3" marker-end="url(#arrowLight)"/>
    <rect x="606" y="612" width="210" height="54" rx="18" fill="#fff7e6"/>
    <text x="635" y="646">Quest / helper setup</text>
    <path d="M816 639 L876 639" stroke="#fff7e6" stroke-width="3" marker-end="url(#arrowLight)"/>
    <rect x="876" y="612" width="210" height="54" rx="18" fill="#fff7e6"/>
    <text x="910" y="646">Review submissions</text>
    <path d="M1086 639 L1146 639" stroke="#fff7e6" stroke-width="3" marker-end="url(#arrowLight)"/>
    <rect x="1146" y="612" width="250" height="54" rx="18" fill="#fff7e6"/>
    <text x="1180" y="646">Close / calculate / payout</text>
  </g>
  <text x="126" y="824" font-family="Arial, sans-serif" font-size="21" fill="#5b675f">Use as planning evidence: role separation, state transition, proof/reward decomposition. Do not use as current AHEYA product truth.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17231f"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff7e6"/>
    </marker>
  </defs>
</svg>
