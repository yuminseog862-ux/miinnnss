    <rect x="72" y="430" width="1056" height="62" rx="12" fill="#0D1728" stroke="#203957"/>
    <text x="96" y="466">feedback_submit</text><text x="318" y="466">Good/Improve, note</text><text x="606" y="466">좋은 점/개선점 분리</text><text x="906" y="466">qualitative signal</text>
    <rect x="72" y="504" width="1056" height="62" rx="12" fill="#0D1728" stroke="#203957"/>
