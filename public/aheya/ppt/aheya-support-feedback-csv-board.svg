  <circle cx="1038" cy="122" r="150" fill="#7FD0FF" opacity=".08"/>
  <text x="72" y="92" fill="#7FD0FF" font-family="Menlo, monospace" font-size="18" font-weight="800">CSV BOARD 19-4</text>
  <text x="72" y="136" fill="#F7ECDD" font-family="Arial, sans-serif" font-size="34" font-weight="800">Support &amp; Feedback Events</text>
  <text x="72" y="166" fill="#B7C7DB" font-family="Arial, sans-serif" font-size="16">wallet support와 quick feedback을 record-ready event로 분리</text>
  <rect x="72" y="210" width="1056" height="56" rx="12" fill="#162842" stroke="#365C82"/>
  <text x="96" y="244" fill="#9FE7FF" font-family="Menlo, monospace" font-size="15" font-weight="800">event</text>
  <text x="318" y="244" fill="#9FE7FF" font-family="Menlo, monospace" font-size="15" font-weight="800">stored fields</text>
  <text x="606" y="244" fill="#9FE7FF" font-family="Menlo, monospace" font-size="15" font-weight="800">review use</text>
  <text x="906" y="244" fill="#9FE7FF" font-family="Menlo, monospace" font-size="15" font-weight="800">boundary</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#F7ECDD">
    <rect x="72" y="282" width="1056" height="62" rx="12" fill="#0D1728" stroke="#203957"/>
    <text x="96" y="318">wallet_support_start</text><text x="318" y="318">session, wallet status</text><text x="606" y="318">support 진입 의도</text><text x="906" y="318">not payment KPI</text>
    <rect x="72" y="356" width="1056" height="62" rx="12" fill="#0D1728" stroke="#203957"/>
