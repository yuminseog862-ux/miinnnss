  <rect x="72" y="596" width="1056" height="30" rx="15" fill="#173450" stroke="#35698A"/>
  <text x="96" y="617" fill="#F4C558" font-family="Arial, sans-serif" font-size="14" font-weight="700">Support and feedback are product actions · not market validation or conversion improvement</text>
