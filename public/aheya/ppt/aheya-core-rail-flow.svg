  <text x="96" y="190" fill="#F7ECDD" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="58" font-weight="700">live idea를 reviewable signal로 바꾸는 흐름</text>
  <text x="98" y="240" fill="#C3A88B" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26">open -> support -> Good/Improve -> optional proof -> reusable signal</text>
