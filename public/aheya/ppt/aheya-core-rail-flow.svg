    <text x="154" y="425" fill="#F7ECDD" font-size="31" font-weight="700">Open</text>
    <text x="430" y="425" fill="#F7ECDD" font-size="31" font-weight="700">Support</text>
    <text x="699" y="425" fill="#F7ECDD" font-size="31" font-weight="700">Good / Improve</text>
    <text x="992" y="425" fill="#F7ECDD" font-size="31" font-weight="700">Proof</text>
