  <rect x="96" y="660" width="1408" height="96" rx="20" fill="#0B1020" stroke="#263653"/>
  <text x="128" y="718" fill="#AAB4D6" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24">Boundary: flow proof only. Do not present as conversion or demand evidence.</text>
