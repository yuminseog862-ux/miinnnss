  <text x="128" y="535" fill="#A1A7B3" font-family="Inter, Arial, sans-serif" font-size="17">사용자에게는 단순한 participation flow로 보이고, 내부에서는 wallet/session, destination, direct-send, review queue를 분리해서 처리</text>

