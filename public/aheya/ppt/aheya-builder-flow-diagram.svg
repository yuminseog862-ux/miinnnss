<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AHEYA builder flow diagram</title>
  <desc id="desc">AI native builder opens a live idea page, receives wallet support and feedback, and reuses the signal in X quote and reply loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1726"/>
      <stop offset="0.56" stop-color="#0f2440"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c5d" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#0c1528" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.28 0 0 0 0 0.78 0 0 0 0 1 0 0 0 0.34 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="1020" cy="72" r="178" fill="#4fd1ff" opacity="0.07"/>
  <circle cx="112" cy="555" r="178" fill="#62d8b6" opacity="0.08"/>
  <path d="M86 454 C290 334, 377 427, 573 304 C736 202, 847 238, 1078 125" fill="none" stroke="#7dd3fc" stroke-opacity="0.13" stroke-width="4"/>
  <text x="60" y="70" fill="#7dd3fc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4">BUILDER FLOW</text>
  <text x="60" y="116" fill="#f7ecdd" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="850">AI로 빠르게 만든 demo를 public response loop로 전환</text>
  <text x="60" y="154" fill="#aab4d6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">build speed 이후 약한 첫 반응을 support / feedback / X reply surface로 연결</text>

  <g transform="translate(62 238)" filter="url(#glow)">
    <line x1="138" y1="86" x2="1035" y2="86" stroke="#4fd1ff" stroke-width="4" stroke-opacity="0.62"/>
    <g>
      <rect x="0" y="0" width="214" height="172" rx="24" fill="url(#card)" stroke="#4fd1ff" stroke-opacity="0.24"/>
      <circle cx="42" cy="44" r="22" fill="#4fd1ff"/>
      <text x="33" y="51" fill="#07101f" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900">01</text>
      <text x="28" y="94" fill="#f7ecdd" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850">Demo / service</text>
      <text x="28" y="130" fill="#aab4d6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">AI로 제작 속도 상승</text>
    </g>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="214" height="172" rx="24" fill="url(#card)" stroke="#4fd1ff" stroke-opacity="0.24"/>
      <circle cx="42" cy="44" r="22" fill="#4fd1ff"/>
      <text x="33" y="51" fill="#07101f" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900">02</text>
      <text x="28" y="94" fill="#f7ecdd" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850">Live idea page</text>
      <text x="28" y="130" fill="#aab4d6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">설명 가능한 public surface</text>
    </g>
    <g transform="translate(500 0)">
      <rect x="0" y="0" width="214" height="172" rx="24" fill="url(#card)" stroke="#62d8b6" stroke-opacity="0.28"/>
      <circle cx="42" cy="44" r="22" fill="#62d8b6"/>
      <text x="33" y="51" fill="#07101f" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900">03</text>
      <text x="28" y="94" fill="#f7ecdd" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850">Support signal</text>
      <text x="28" y="130" fill="#aab4d6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">wallet-backed first action</text>
    </g>
    <g transform="translate(750 0)">
      <rect x="0" y="0" width="214" height="172" rx="24" fill="url(#card)" stroke="#62d8b6" stroke-opacity="0.28"/>
      <circle cx="42" cy="44" r="22" fill="#62d8b6"/>
      <text x="33" y="51" fill="#07101f" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900">04</text>
      <text x="28" y="94" fill="#f7ecdd" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850">X feedback loop</text>
      <text x="28" y="130" fill="#aab4d6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">quote / reply로 재노출</text>
    </g>
  </g>

  <rect x="60" y="500" width="1080" height="64" rx="32" fill="#0b1324" stroke="#4fd1ff" stroke-opacity="0.22"/>
  <text x="94" y="540" fill="#f7ecdd" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Portfolio read:</text>
  <text x="248" y="540" fill="#aab4d6" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650">성과가 아니라, 첫 반응을 만들고 다시 public copy로 꺼내는 제품/마케팅 loop 설계</text>
</svg>
