    <text x="181" y="187" fill="#7fd0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="900">SUPPORT</text>
    <rect x="302" y="164" width="62" height="34" rx="17" fill="#12253a" stroke="#7fd0ff" stroke-opacity="0.28"/>
    <text x="321" y="187" fill="#7fd0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="900">FB</text>
  </g>

  <line x1="950" y1="359" x2="1044" y2="359" stroke="#7fd0ff" stroke-width="3" marker-end="url(#arrow)"/>

