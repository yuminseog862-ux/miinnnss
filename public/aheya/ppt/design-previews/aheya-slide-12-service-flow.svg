    <text x="32" y="96" fill="#f7ecdd" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="900">Live idea page</text>
    <text x="32" y="134" fill="#c6d2dc" font-family="Geist, Inter, Arial, sans-serif" font-size="21" font-weight="700">demo를 public idea와 CTA로 설명</text>
    <rect x="32" y="164" width="116" height="34" rx="17" fill="#12253a" stroke="#7fd0ff" stroke-opacity="0.28"/>
