<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="bgB" cx="50%" cy="18%" r="80%">
      <stop offset="0" stop-color="#18364e" stop-opacity="0.66"/>
      <stop offset="0.54" stop-color="#07101d"/>
      <stop offset="1" stop-color="#03060c"/>
    </radialGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#153148" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#050910" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" x2="1">
