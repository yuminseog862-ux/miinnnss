  <rect width="1600" height="900" fill="url(#bgB)"/>
  <path d="M180 690 C430 470 660 760 900 520 S1280 300 1480 488" fill="none" stroke="#7fd0ff" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="235" cy="190" r="160" fill="#58e0c2" opacity="0.035"/>
  <circle cx="1324" cy="704" r="220" fill="#7f7cff" opacity="0.04"/>

  <text x="82" y="94" fill="#7fd0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="900" letter-spacing="1.4">BRIDGE FLOW</text>
  <text x="82" y="158" fill="#f7ecdd" font-family="Geist, Inter, Arial, sans-serif" font-size="58" font-weight="900">Builder × Web3 Value Bridge</text>
