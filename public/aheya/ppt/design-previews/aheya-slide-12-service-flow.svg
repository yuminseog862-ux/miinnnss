    <text x="28" y="86" fill="#f7ecdd" font-family="Geist, Inter, Arial, sans-serif" font-size="30" font-weight="900">Wallet support</text>
    <text x="28" y="124" fill="#aeb8c4" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="650">작은 wallet action을 실제 제품 참여로</text>
    <text x="28" y="150" fill="#aeb8c4" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="650">바꾸고 Good / Improve response를 남김</text>
  </g>

  <g transform="translate(198 548)">
    <rect x="0" y="0" width="360" height="132" rx="24" fill="#060a11" stroke="#7fd0ff" stroke-opacity="0.16"/>
    <text x="24" y="38" fill="#7fd0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="900">BUILDER GETS</text>
    <text x="24" y="78" fill="#f7ecdd" font-family="Geist, Inter, Arial, sans-serif" font-size="24" font-weight="900">first support · quick feedback</text>
    <text x="24" y="110" fill="#aeb8c4" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="650">saved response record for next update</text>
  </g>
  <g transform="translate(620 548)">
    <rect x="0" y="0" width="360" height="132" rx="24" fill="#060a11" stroke="#58e0c2" stroke-opacity="0.16"/>
    <text x="24" y="38" fill="#58e0c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="900">WEB3 USER GETS</text>
    <text x="24" y="78" fill="#f7ecdd" font-family="Geist, Inter, Arial, sans-serif" font-size="24" font-weight="900">useful wallet participation</text>
    <text x="24" y="110" fill="#aeb8c4" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="650">small support action with clear response</text>
  </g>
  <g transform="translate(1042 548)">
    <rect x="0" y="0" width="360" height="132" rx="24" fill="#060a11" stroke="#b49cff" stroke-opacity="0.18"/>
    <text x="24" y="38" fill="#b49cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="900">CONTENT LOOP</text>
    <text x="24" y="78" fill="#f7ecdd" font-family="Geist, Inter, Arial, sans-serif" font-size="24" font-weight="900">feedback → quote / reply</text>
    <text x="24" y="110" fill="#aeb8c4" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="650">public copy material, not growth proof</text>
  </g>

  <rect x="412" y="738" width="776" height="50" rx="25" fill="#111725" stroke="#f4c558" stroke-opacity="0.28"/>
  <text x="800" y="771" fill="#f4c558" text-anchor="middle" font-family="Geist, Inter, Arial, sans-serif" font-size="20" font-weight="850">Boundary: exposure 가능성 설계이지 growth outcome claim은 아님</text>
