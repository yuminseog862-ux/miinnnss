    <text x="28" y="124" fill="#aeb8c4" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="650">빠르게 만들지만 첫 반응과</text>
    <text x="28" y="150" fill="#aeb8c4" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="650">명확한 feedback record가 약함</text>
