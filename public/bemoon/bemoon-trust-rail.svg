<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">BE;MOON trust rail</title>
  <desc id="desc">A source diagram for the BE;MOON fashion digital warranty flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080705"/>
      <stop offset="0.52" stop-color="#15110b"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#f2b15c"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#62d8b6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="84" r="190" fill="#f2b15c" opacity="0.08"/>
  <circle cx="160" cy="640" r="230" fill="#7dd3fc" opacity="0.07"/>
  <g transform="translate(76 72)">
    <text x="0" y="0" fill="#f2b15c" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="4">BE;MOON</text>
    <text x="0" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="850">Fashion Trust Rail</text>
    <text x="0" y="104" fill="#bfc7c9" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">
      Digital warranty SaaS for purchase proof, verification, and OMS sync
    </text>
  </g>
  <g transform="translate(76 216)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1128" height="336" rx="26" fill="#11100d" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M126 168 H1002" stroke="url(#rail)" stroke-width="12" stroke-linecap="round"/>
    <g font-family="Inter, Arial, sans-serif">
      <g transform="translate(60 64)">
        <circle cx="66" cy="104" r="54" fill="#21190d" stroke="#f2b15c" stroke-width="2"/>
        <text x="66" y="96" text-anchor="middle" fill="#f2b15c" font-size="18" font-weight="900">01</text>
        <text x="66" y="122" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">PURCHASE</text>
        <text x="0" y="222" fill="#ffffff" font-size="24" font-weight="820">QR / WL auth</text>
        <text x="0" y="252" fill="#aeb8b8" font-size="16">Buyer and item entry</text>
      </g>
      <g transform="translate(322 64)">
        <circle cx="66" cy="104" r="54" fill="#0b1b20" stroke="#7dd3fc" stroke-width="2"/>
        <text x="66" y="96" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="900">02</text>
        <text x="66" y="122" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">ISSUE</text>
        <text x="0" y="222" fill="#ffffff" font-size="24" font-weight="820">Proof issuance</text>
        <text x="0" y="252" fill="#aeb8b8" font-size="16">Warranty becomes portable</text>
      </g>
      <g transform="translate(594 64)">
        <circle cx="66" cy="104" r="54" fill="#101a18" stroke="#62d8b6" stroke-width="2"/>
        <text x="66" y="96" text-anchor="middle" fill="#62d8b6" font-size="18" font-weight="900">03</text>
        <text x="66" y="122" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">VERIFY</text>
        <text x="0" y="222" fill="#ffffff" font-size="24" font-weight="820">Authenticity check</text>
        <text x="0" y="252" fill="#aeb8b8" font-size="16">External trust surface</text>
      </g>
      <g transform="translate(868 64)">
        <circle cx="66" cy="104" r="54" fill="#19161f" stroke="#aab5ff" stroke-width="2"/>
        <text x="66" y="96" text-anchor="middle" fill="#aab5ff" font-size="18" font-weight="900">04</text>
        <text x="66" y="122" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">SYNC</text>
        <text x="0" y="222" fill="#ffffff" font-size="24" font-weight="820">OMS state sync</text>
        <text x="0" y="252" fill="#aeb8b8" font-size="16">Brand operation fit</text>
      </g>
    </g>
  </g>
  <g transform="translate(76 606)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="1128" height="48" rx="24" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="26" y="31" fill="#dfe7e8" font-size="16" font-weight="700">Core claim</text>
    <text x="142" y="31" fill="#aeb8b8" font-size="16">Digital warranty is an operating rail for brand trust, verification, resale readiness, and ownership continuity.</text>
  </g>
</svg>
